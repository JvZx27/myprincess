<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carta Animada & Galeria do Amor ♥</title>
  <!-- html2canvas para download da carta -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffe6f0;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    .background {
      position: fixed;
      width: 100vw;
      height: 100vh;
      left: 0;
      top: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      transform: rotate(45deg);
      animation: float 8s linear infinite;
      opacity: 0.7;
    }
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      border-radius: 50%;
    }
    .heart::before {
      top: -10px;
      left: 0;
    }
    .heart::after {
      left: -10px;
      top: 0;
    }
    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg);
        opacity: 0;
      }
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      min-height: 100vh;
      z-index: 1;
      position: relative;
    }
    .left-side {
      flex: 1 1 320px;
      background: #fff;
      border-right: 2px solid #ffb6d5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 48px 36px 48px 56px;
      min-width: 320px;
      z-index: 2;
    }
    .left-side h2 {
      color: #e75480;
      margin-top: 0;
    }
    .left-side textarea {
      width: 100%;
      max-width: 420px;
      min-height: 180px;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1.5px solid #ffc1e3;
      background: #fff9fc;
      resize: vertical;
      margin-top: 12px;
      margin-bottom: 24px;
      box-sizing: border-box;
      color: #b30047;
    }
    .left-side .info {
      color: #b30047;
      font-size: 15px;
      margin-bottom: 0;
      margin-top: 4px;
    }
    .right-side {
      flex: 1 1 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 340px;
      padding: 0 36px;
      z-index: 2;
    }
    .envelope-container {
      width: 350px;
      height: 330px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      margin-top: 45px;
      margin-bottom: 0;
      user-select: none;
      z-index: 3;
    }
    .envelope {
      width: 290px;
      height: 190px;
      position: relative;
      perspective: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .envelope-flap {
      width: 0;
      height: 0;
      border-left: 145px solid transparent;
      border-right: 145px solid transparent;
      border-bottom: 80px solid #e75480;
      position: absolute;
      top: -80px;
      left: 0;
      z-index: 3;
      border-radius: 12px 12px 30px 30px;
      transition: transform 0.8s cubic-bezier(.23,1.45,.32,1) 0s;
      transform-origin: bottom center;
      box-shadow: 0 4px 10px #e7548055;
      cursor: pointer;
    }
    .envelope.open .envelope-flap {
      transform: rotateX(-120deg);
    }
    .envelope-base {
      width: 290px;
      height: 190px;
      background: #fffdfa;
      border: 2.5px solid #e75480;
      border-radius: 0 0 20px 20px / 0 0 24px 24px;
      box-shadow: 0 5px 20px #ffb6d54b;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    .envelope-letter {
      width: 262px;
      height: 138px;
      background: #fff9fc;
      border-radius: 14px;
      border: 1.2px solid #ffb6d5;
      position: absolute;
      left: 14px;
      top: 30px;
      z-index: 2;
      box-shadow: 0 2px 12px #ffd6e776;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(45px) scale(0.93);
      transition: opacity 0.7s, transform 0.7s;
      pointer-events: none;
      font-size: 23px;
      color: #e75480;
      font-weight: bold;
      text-align: center;
      letter-spacing: 0.5px;
      line-height: 1.3;
      user-select: text;
      overflow: auto;
    }
    .envelope.open .envelope-letter {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      transition-delay: 0.2s;
    }
    .envelope.open .envelope-base {
      box-shadow: 0 7px 24px #e7548047;
    }
    .envelope-btn, .envelope-edit-btn, .envelope-download-btn {
      margin-top: 28px;
      background: #e75480;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 32px 11px 32px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 18px #ffb6d57c;
      transition: background 0.16s;
      z-index: 4;
      position: relative;
      margin-right: 10px;
      margin-bottom: 0;
    }
    .envelope-btn:hover, .envelope-edit-btn:hover, .envelope-download-btn:hover {
      background: #b30047;
    }
    .envelope-edit-btn {
      background: #ffd6e7;
      color: #e75480;
      border: 1.5px solid #e75480;
      display: none;
    }
    .envelope-edit-btn:hover {
      background: #ffe6f0;
      color: #b30047;
    }
    .envelope-download-btn {
      background: #fff9fc;
      color: #e75480;
      border: 1.5px solid #e75480;
      display: none;
    }
    .envelope-download-btn:hover {
      background: #ffd6e7;
      color: #b30047;
    }
    .flores-decor {
      position: absolute;
      pointer-events: none;
      z-index: 5;
    }
    .flor-top-left {
      top: -32px; left: -34px; width: 73px; height: 73px;
      transform: rotate(-16deg);
    }
    .flor-bottom-right {
      bottom: -25px; right: -32px; width: 75px; height: 75px;
      transform: rotate(18deg);
    }
    .flor-bottom-left {
      bottom: -23px; left: -24px; width: 48px; height: 48px;
      transform: rotate(-7deg);
    }
    .flor-top-right {
      top: -24px; right: -23px; width: 44px; height: 44px;
      transform: rotate(12deg);
    }
    .gallery-section {
      width: 100%;
      background: #ffe6f0;
      padding: 36px 0 46px 0;
      z-index: 2;
      position: relative;
    }
    .gallery-section h1 {
      text-align: center;
      color: #e75480;
      padding: 20px 0 8px 0;
      font-size: 2.1em;
      margin: 0 0 18px 0;
      letter-spacing: 1px;
    }
    .upload-label {
      margin-left: 16px;
      cursor: pointer;
    }
    .upload-btn {
      background: #e75480;
      color: #fff;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 15px;
      margin-bottom: 12px;
      display: inline-block;
    }
    .upload-btn:hover {
      background: #b30047;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      padding: 0 16px 0 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(231, 84, 128, 0.4);
      transition: transform 0.3s, box-shadow 0.3s;
      aspect-ratio: 3/4;
      background: #fff;
    }
    .gallery img:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 24px rgba(231, 84, 128, 0.60);
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      padding-top: 60px;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.8);
    }
    .modal-content {
      margin: auto;
      display: block;
      width: 90vw;
      max-width: 500px;
      border-radius: 20px;
      box-shadow: 0 4px 40px #e7548055;
      transition: transform 0.3s;
    }
    .close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    @media (max-width: 900px) {
      .container { flex-direction: column; }
      .left-side { border-right: none; border-bottom: 2px solid #ffb6d5; padding: 20px 4vw 20px 4vw; min-width: unset;}
      .right-side { width: 100vw; min-width: unset; padding: 0 6vw; }
      .envelope-container { width: 100vw; }
      .envelope, .envelope-base { width: 98vw; min-width: unset; max-width: 320px; }
    }
    @media (max-width: 700px) {
      .left-side { padding: 20px 4vw 20px 4vw; }
      .right-side { padding: 0 2vw; }
      .envelope-container { margin-top: 22px; }
      .envelope, .envelope-base { width: 95vw; max-width: 220px; }
      .envelope-letter { width: 85vw; max-width: 170px; }
      .gallery-section { padding: 20px 0 32px 0; }
      .gallery-section h1 { font-size: 1.3em; }
    }
    .counter-container {
      position: fixed;
      left: 0;
      bottom: 0;
      width: fit-content;
      min-width: 290px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      background: rgba(255, 240, 249, 0.97);
      border-top: 2px solid #ffb6d5;
      border-right: 2px solid #ffb6d5;
      border-radius: 0 18px 0 0;
      padding: 18px 30px 14px 18px;
      z-index: 99;
      box-shadow: 0 -2px 14px #ffd6e7;
      gap: 18px;
    }
    .counter-label {
      color: #e75480;
      font-size: 18px;
      font-weight: bold;
      margin-right: 10px;
    }
    .counter-input {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1.5px solid #ffc1e3;
      font-size: 16px;
      background: #fff9fc;
      color: #b30047;
      margin-right: 8px;
    }
    .counter-days {
      color: #b30047;
      font-size: 18px;
      font-weight: bold;
      margin-left: 12px;
      letter-spacing: 1px;
      min-width: 80px;
      display: inline-block;
    }
    .counter-btn {
      background: #e75480;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 18px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.18s;
      margin-left: 5px;
    }
    .counter-btn:hover {
      background: #b30047;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
    .zoomIn { animation: zoomIn .35s; }
    @keyframes zoomIn {
      from { transform: scale(.7); opacity: 0.2; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="background" id="background" aria-hidden="true"></div>
  <main class="container">
    <section class="left-side" aria-label="Mensagem personalizada">
      <h2 id="msg-label">Seu Texto Especial</h2>
      <textarea id="custom-text" aria-labelledby="msg-label" placeholder="Escreva uma mensagem de amor, poema, dedicatória..." autocomplete="off"></textarea>
      <div class="info" id="msg-info">Este espaço é para sua mensagem pessoal ou dedicatória especial ♥</div>
    </section>
    <section class="right-side" aria-label="Envelope animado">
      <div class="envelope-container">
        <button class="envelope-btn" id="open-envelope-btn" aria-label="Abrir carta de amor">Abrir Carta</button>
        <button class="envelope-edit-btn" id="edit-envelope-btn" aria-label="Editar carta de amor">Editar</button>
        <button class="envelope-download-btn" id="download-btn" aria-label="Salvar imagem da carta">Salvar Carta</button>
        <div class="envelope" id="envelope" tabindex="0" aria-label="Envelope animado">
          <div class="envelope-flap"></div>
          <div class="envelope-base"></div>
          <div class="envelope-letter" id="envelope-letter" aria-live="polite">
            Feliz Dia dos Namorados!<br>
            <span style="font-size:16px;font-weight:400;color:#b30047;">Com amor, seu eterno namorado(a)!</span>
          </div>
          <!-- Flores decorativas SVG -->
          <svg class="flores-decor flor-top-left" viewBox="0 0 60 60" aria-hidden="true">
            <circle cx="30" cy="30" r="15" fill="#ffb6d5"/>
            <ellipse cx="18" cy="19" rx="10" ry="6" fill="#e75480" />
            <ellipse cx="40" cy="19" rx="10" ry="6" fill="#e75480" />
            <ellipse cx="18" cy="41" rx="10" ry="6" fill="#e75480" />
            <ellipse cx="40" cy="41" rx="10" ry="6" fill="#e75480" />
          </svg>
          <svg class="flores-decor flor-bottom-right" viewBox="0 0 60 60" aria-hidden="true">
            <circle cx="30" cy="30" r="17" fill="#ff3366"/>
            <ellipse cx="15" cy="35" rx="11" ry="7" fill="#ffb6d5" />
            <ellipse cx="45" cy="27" rx="10" ry="5" fill="#e75480" />
            <ellipse cx="30" cy="52" rx="7" ry="4" fill="#e75480" />
          </svg>
          <svg class="flores-decor flor-bottom-left" viewBox="0 0 38 38" aria-hidden="true">
            <ellipse cx="19" cy="19" rx="13" ry="8" fill="#ffb6d5"/>
            <ellipse cx="12" cy="13" rx="6" ry="3" fill="#e75480" />
          </svg>
          <svg class="flores-decor flor-top-right" viewBox="0 0 38 38" aria-hidden="true">
            <ellipse cx="19" cy="19" rx="13" ry="8" fill="#e75480"/>
            <ellipse cx="27" cy="10" rx="5" ry="2.5" fill="#ffb6d5" />
          </svg>
        </div>
      </div>
    </section>
  </main>
  <!-- Galeria -->
 <section class="gallery-section" aria-label="Galeria de fotos">
  <h1>🌸 Nossas Memórias 🌸</h1>
  <label for="galeria-upload" class="upload-label">
    <input type="file" id="galeria-upload" accept="image/*" multiple style="display:none;">
    <span class="upload-btn">Adicionar Fotos</span>
  </label>
<div class="gallery" id="gallery">
  <img src="public/image1.jpg" alt="Foto divertida do casal, clima descontraído à noite">
  <img src="public/image2.jpg" alt="Selfie do casal sorrindo sentados juntos">
  <img src="public/image3.jpg" alt="Carinho do casal durante o dia, momento íntimo">
  <img src="public/image4.jpg" alt="Foto do casal em um parque de diversões, dia ensolarado, roda gigante ao fundo">
  <img src="public/image5.jpg" alt="Foto do casal com clima carinhoso, ambiente escuro">
  <img src="public/image6.jpg" alt="Selfie do casal juntos à noite, clima divertido">
</div>
</section>
  <!-- Modal da galeria -->
  <div id="myModal" class="modal" aria-modal="true" role="dialog" tabindex="-1">
    <span class="close" aria-label="Fechar imagem ampliada">&times;</span>
    <img class="modal-content" id="imgModal" alt="Foto ampliada da galeria">
  </div>
  <!-- Contador de dias -->
  <div class="counter-container" aria-label="Contador de dias juntos">
    <span class="counter-label">Desde:</span>
    <input type="date" id="date-input" class="counter-input" aria-label="Escolha a data de início do relacionamento">
    <button class="counter-btn" onclick="setStartDate()" aria-label="Contar dias">Contar Dias</button>
    <span class="counter-days" id="counter-days">0 dias</span>
  </div>
  <script>
    // ==== Fundo de corações animados ====
    const background = document.getElementById('background');
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (5 + Math.random() * 5) + "s";
      heart.style.background = `hsl(${Math.random()*360}, 68%, 85%)`;
      background.appendChild(heart);
      setTimeout(() => { heart.remove(); }, 10000);
    }
    setInterval(createHeart, 300);

    // ==== Envelope Animado com mensagem personalizada, salvar no localStorage e extras fofos ====
    const envelope = document.getElementById('envelope');
    const envelopeBtn = document.getElementById('open-envelope-btn');
    const editBtn = document.getElementById('edit-envelope-btn');
    const downloadBtn = document.getElementById('download-btn');
    const envelopeLetter = document.getElementById('envelope-letter');
    const customText = document.getElementById('custom-text');
    const msgInfo = document.getElementById('msg-info');

    // Mensagens aleatórias fofas para carta sem texto personalizado
    const mensagensFofo = [
      "Você é meu sonho realizado! 💖",
      "Cada dia ao seu lado é uma nova aventura de amor.",
      "Meu coração é todo seu, sempre!",
      "Com você, tudo é mais colorido e feliz.",
      "Te amo mais do que ontem e menos do que amanhã.",
      "Você faz meu mundo melhor. Te amo!",
      "Você me faz sorrir só por existir. 💞",
      "Ao seu lado, descobri o verdadeiro significado do amor.",
      "Eu escolheria você em todas as vidas.",
      "Você é meu presente favorito da vida."
    ];
    function mensagemAleatoria() {
      return mensagensFofo[Math.floor(Math.random() * mensagensFofo.length)];
    }

    // Recupera mensagem salva
    function loadSavedText() {
      const saved = localStorage.getItem('loveLetterText');
      if (saved) customText.value = saved;
    }
    loadSavedText();

    let opened = false;

    // Sanitização básica: evita tags perigosas, só permite <br>
    function sanitize(text) {
      return text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
    }

    function showLetter() {
      let txt = customText.value.trim();
      if (txt.length === 0) {
        envelopeLetter.innerHTML = mensagemAleatoria();
      } else {
        envelopeLetter.innerHTML = sanitize(txt);
        localStorage.setItem('loveLetterText', txt);
      }
    }

    envelopeBtn.addEventListener('click', function() {
      if (!opened) {
        showLetter();
        envelope.classList.add('open');
        envelopeBtn.style.display = "none";
        editBtn.style.display = "inline-block";
        downloadBtn.style.display = "inline-block";
        customText.setAttribute("readonly", true);
        opened = true;
      }
    });

    editBtn.addEventListener('click', function() {
      envelope.classList.remove('open');
      envelopeBtn.style.display = "inline-block";
      editBtn.style.display = "none";
      downloadBtn.style.display = "none";
      customText.removeAttribute("readonly");
      opened = false;
    });

    // Salva mensagem sempre que digita (auto-save)
    customText.addEventListener('input', function() {
      localStorage.setItem('loveLetterText', customText.value);
    });

    // Mensagem de validação ao tentar abrir carta vazia
    envelopeBtn.addEventListener('click', function(){
      if (customText.value.trim().length === 0) {
        msgInfo.textContent = "Você pode personalizar sua mensagem antes de abrir a carta! ♥";
        msgInfo.style.color = "#e75480";
        setTimeout(()=>{ msgInfo.textContent = "Este espaço é para sua mensagem pessoal ou dedicatória especial ♥"; msgInfo.style.color="#b30047"; }, 3200);
      }
    });

    // ==== Botão para baixar a carta como imagem ====
    downloadBtn.addEventListener('click', function() {
      html2canvas(envelope, {
        backgroundColor: null,
        scale: 2
      }).then(canvas => {
        let link = document.createElement('a');
        link.download = 'minha-carta-de-amor.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    });

    // ==== Contador de Dias: mostra Anos, Meses, Dias ====
    function setStartDate() {
      const input = document.getElementById('date-input');
      const value = input.value;
      if (!value) {
        document.getElementById('counter-days').textContent = "0 dias";
        return;
      }
      localStorage.setItem('loveStartDate', value);
      updateDaysCounter();
    }
    function updateDaysCounter() {
      const startDate = localStorage.getItem('loveStartDate');
      if (!startDate) {
        document.getElementById('counter-days').textContent = "0 dias";
        return;
      }
      const start = new Date(startDate + "T00:00:00");
      const now = new Date();
      let diff = now - start;
      if (diff < 0) diff = 0;
      let days = Math.floor(diff / (24 * 60 * 60 * 1000));
      // Cálculo de anos, meses, dias
      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      let day = now.getDate() - start.getDate();
      if (day < 0) {
        months -= 1;
        day += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }
      let display = "";
      if (years > 0) display += years + (years === 1 ? " ano, " : " anos, ");
      if (months > 0) display += months + (months === 1 ? " mês, " : " meses, ");
      display += (day >= 0 ? day : 0) + (day === 1 ? " dia" : " dias");
      document.getElementById('counter-days').textContent = display;
      document.getElementById('date-input').value = startDate;
    }
    document.getElementById('date-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') setStartDate();
    });
    updateDaysCounter();
    setInterval(updateDaysCounter, 60 * 60 * 1000);

    // ==== Galeria Modal com animação de zoom ====
    const modal = document.getElementById("myModal");
    const modalImg = document.getElementById("imgModal");
    const gallery = document.getElementById('gallery');
    function addImgToModal(img) {
      modal.style.display = "block";
      modalImg.src = img.src;
      modalImg.classList.remove('zoomIn');
      void modalImg.offsetWidth;
      modalImg.classList.add('zoomIn');
    }
    gallery.querySelectorAll("img").forEach(img => {
      img.onclick = function() {
        addImgToModal(this);
      }
    });
    const span = document.getElementsByClassName("close")[0];
    span.onclick = function() {
      modal.style.display = "none";
    }
    modal.onclick = function(e) {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    }
    // Fecha modal com Esc
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.style.display === "block") {
        modal.style.display = "none";
      }
    });

    // ==== Upload de fotos para galeria ====
    document.getElementById('galeria-upload').addEventListener('change', function(e){
      Array.from(e.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(ev){
          const img = document.createElement('img');
          img.src = ev.target.result;
          img.alt = "Foto nova do casal";
          img.onclick = function() {
            addImgToModal(img);
          }
          gallery.appendChild(img);
        }
        reader.readAsDataURL(file);
      });
    });
  </script>
</body>
</html>
